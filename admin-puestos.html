<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Gestión de Puestos - Admin HUNSC</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "brand-primary": "#5A0E6E",
            "brand-accent": "#AF9100",
          },
        },
      },
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8eaf0 100%);
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    .draggable-item {
      cursor: move;
      transition: all 0.2s;
    }
    .draggable-item:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 12px -2px rgba(0, 0, 0, 0.1);
    }
    .draggable-item.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }
    .drop-zone {
      min-height: 80px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      transition: all 0.2s;
    }
    .drop-zone.drag-over {
      border-color: #5A0E6E;
      background-color: #f3e8ff;
      border-style: solid;
    }
    .gradient-purple {
      background: linear-gradient(135deg, #5A0E6E 0%, #7B2D8E 100%);
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #10B981;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>

<body class="bg-gray-50">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <div class="flex items-center gap-4">
          <a href="admin-dashboard.html" class="material-symbols-outlined text-gray-600 hover:text-brand-primary">arrow_back</a>
          <div>
            <h1 class="text-xl font-bold text-gray-900">Gestión de Puestos de Trabajo</h1>
            <p class="text-sm text-gray-500">Asignar personal a puestos por área</p>
          </div>
        </div>
        <button onclick="openCreateModal()" class="gradient-purple text-white px-6 py-3 rounded-xl font-semibold hover:opacity-90 flex items-center gap-2">
          <span class="material-symbols-outlined">add</span>
          Nueva Área/Puesto
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Estadísticas -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="card p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
            <span class="material-symbols-outlined text-green-600">person</span>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900" id="stat-disponible">0</p>
            <p class="text-xs text-gray-600">Disponibles</p>
          </div>
        </div>
      </div>

      <div class="card p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
            <span class="material-symbols-outlined text-blue-600">check_circle</span>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900" id="stat-asignado">0</p>
            <p class="text-xs text-gray-600">Asignados</p>
          </div>
        </div>
      </div>

      <div class="card p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-amber-100 rounded-lg flex items-center justify-center">
            <span class="material-symbols-outlined text-amber-600">pending</span>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900" id="stat-pendientes">0</p>
            <p class="text-xs text-gray-600">Puestos vacíos</p>
          </div>
        </div>
      </div>

      <div class="card p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
            <span class="material-symbols-outlined text-purple-600">domain</span>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-900" id="stat-areas">0</p>
            <p class="text-xs text-gray-600">Áreas</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Layout de Drag & Drop -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

      <!-- IZQUIERDA: Personal Disponible -->
      <div class="card p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold text-gray-900">Personal</h2>
          <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold" id="count-disponible">0 disponibles</span>
        </div>

        <div class="mb-4">
          <input type="text" id="searchPersonal" onkeyup="searchPersonal()" placeholder="Buscar personal..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-primary"/>
        </div>

        <div id="personal-container" class="space-y-3 max-h-[600px] overflow-y-auto">
          <!-- Personal se carga dinámicamente -->
        </div>
      </div>

      <!-- DERECHA: Puestos de Trabajo por Área -->
      <div class="card p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold text-gray-900">Áreas y Puestos</h2>
          <div class="flex items-center gap-3">
            <button
              id="btn-toggle-view"
              onclick="toggleView()"
              class="px-4 py-2 bg-brand-primary text-white rounded-xl text-sm font-semibold hover:opacity-90 flex items-center gap-2">
              <span class="material-symbols-outlined text-lg">visibility</span>
              <span id="view-label">Solo Pendientes</span>
            </button>
            <span class="px-3 py-1 bg-brand-primary text-white rounded-full text-sm font-semibold" id="count-areas">0 áreas</span>
          </div>
        </div>

        <div id="areas-container" class="space-y-4 max-h-[600px] overflow-y-auto">
          <!-- Áreas se cargan dinámicamente -->
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Crear Área/Puesto -->
  <div id="createModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-bold text-gray-900">Crear Nueva Área/Puesto</h3>
        <button onclick="closeCreateModal()" class="p-2 hover:bg-gray-100 rounded-full">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo</label>
          <select id="createType" onchange="toggleCreateFields()" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-primary">
            <option value="area">Nueva Área</option>
            <option value="puesto">Nuevo Puesto en Área Existente</option>
          </select>
        </div>

        <!-- Campo: Nombre del Área -->
        <div id="field-area-name">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre del Área</label>
          <input type="text" id="areaName" placeholder="Ej: Farmacotecnia" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-primary"/>
        </div>

        <!-- Campo: Color del Área -->
        <div id="field-area-color">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Color del Área</label>
          <select id="areaColor" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-primary">
            <option value="purple">Púrpura</option>
            <option value="green">Verde</option>
            <option value="amber">Ámbar</option>
            <option value="blue">Azul</option>
            <option value="red">Rojo</option>
            <option value="pink">Rosa</option>
            <option value="teal">Turquesa</option>
            <option value="indigo">Índigo</option>
          </select>
        </div>

        <!-- Campo: Seleccionar Área Existente -->
        <div id="field-select-area" class="hidden">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Seleccionar Área</label>
          <select id="selectArea" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-primary">
            <!-- Se llena dinámicamente -->
          </select>
        </div>

        <!-- Campo: Nombre del Puesto -->
        <div id="field-puesto-name" class="hidden">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre del Puesto</label>
          <input type="text" id="puestoName" placeholder="Ej: Turno Mañana" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-primary"/>
        </div>

        <button onclick="createAreaOrPuesto()" class="w-full gradient-purple text-white py-4 rounded-xl font-semibold hover:opacity-90">
          Crear
        </button>
      </div>
    </div>
  </div>

  <script>
    // Datos de personal
    const personalData = [
      { id: 1, name: 'Ana Pérez García', role: 'Farmacéutica Adjunta', avatar: 'https://via.placeholder.com/48' },
      { id: 2, name: 'Juan Rodríguez', role: 'Técnico de Farmacia', avatar: 'https://via.placeholder.com/48' },
      { id: 3, name: 'María Sanz', role: 'Farmacéutica Residente (FIR)', avatar: 'https://via.placeholder.com/48' },
      { id: 4, name: 'Laura Gómez', role: 'Farmacéutica Especialista', avatar: 'https://via.placeholder.com/48' },
      { id: 5, name: 'Carlos Vega', role: 'Técnico Superior', avatar: 'https://via.placeholder.com/48' },
      { id: 6, name: 'Pedro Martín', role: 'Farmacéutico Adjunto', avatar: 'https://via.placeholder.com/48' },
      { id: 7, name: 'Sofía López', role: 'Técnico de Farmacia', avatar: 'https://via.placeholder.com/48' },
      { id: 8, name: 'Diego Fernández', role: 'Farmacéutico Residente', avatar: 'https://via.placeholder.com/48' },
      { id: 9, name: 'Isabel García', role: 'Farmacéutica', avatar: 'https://via.placeholder.com/48' },
      { id: 10, name: 'Miguel Ángel Sanz', role: 'Técnico Superior', avatar: 'https://via.placeholder.com/48' }
    ];

    // Datos de áreas y puestos
    const areasData = [
      {
        id: 'area-1',
        name: 'Unidosis',
        color: 'purple',
        puestos: [
          { id: 'puesto-1', name: 'Turno Mañana (08:00-15:00)', assigned: null },
          { id: 'puesto-2', name: 'Turno Tarde (15:00-22:00)', assigned: 4 }
        ]
      },
      {
        id: 'area-2',
        name: 'Farmacotecnia',
        color: 'green',
        puestos: [
          { id: 'puesto-3', name: 'Preparación Mezclas', assigned: null },
          { id: 'puesto-4', name: 'Control de Calidad', assigned: 5 },
          { id: 'puesto-5', name: 'Registro y Documentación', assigned: null }
        ]
      },
      {
        id: 'area-3',
        name: 'Nutrición Parenteral',
        color: 'amber',
        puestos: [
          { id: 'puesto-6', name: 'Preparación NP', assigned: null }
        ]
      },
      {
        id: 'area-4',
        name: 'Dispensación Ambulatoria',
        color: 'blue',
        puestos: [
          { id: 'puesto-7', name: 'Ventanilla 1', assigned: 3 },
          { id: 'puesto-8', name: 'Ventanilla 2', assigned: null }
        ]
      }
    ];

    let currentView = 'pendientes'; // 'pendientes' o 'todas'
    let draggedElement = null;

    // Configuración de colores
    const colorConfig = {
      purple: { border: '#8B5CF6', bg: '#F5F3FF', dot: 'bg-purple-500', text: 'text-purple-700' },
      green: { border: '#10B981', bg: '#ECFDF5', dot: 'bg-green-500', text: 'text-green-700' },
      amber: { border: '#F59E0B', bg: '#FFFBEB', dot: 'bg-amber-500', text: 'text-amber-700' },
      blue: { border: '#3B82F6', bg: '#EFF6FF', dot: 'bg-blue-500', text: 'text-blue-700' },
      red: { border: '#EF4444', bg: '#FEF2F2', dot: 'bg-red-500', text: 'text-red-700' },
      pink: { border: '#EC4899', bg: '#FDF2F8', dot: 'bg-pink-500', text: 'text-pink-700' },
      teal: { border: '#14B8A6', bg: '#F0FDFA', dot: 'bg-teal-500', text: 'text-teal-700' },
      indigo: { border: '#6366F1', bg: '#EEF2FF', dot: 'bg-indigo-500', text: 'text-indigo-700' }
    };

    function init() {
      renderPersonal();
      renderAreas();
      updateStats();
    }

    // Obtener personal disponible (sin asignaciones o con menos asignaciones)
    function getAvailablePersonal() {
      const assignedCount = {};

      // Contar asignaciones por persona
      areasData.forEach(area => {
        area.puestos.forEach(puesto => {
          if (puesto.assigned !== null) {
            assignedCount[puesto.assigned] = (assignedCount[puesto.assigned] || 0) + 1;
          }
        });
      });

      return personalData.map(person => ({
        ...person,
        assignmentCount: assignedCount[person.id] || 0
      }));
    }

    function renderPersonal() {
      const container = document.getElementById('personal-container');
      const personal = getAvailablePersonal();

      container.innerHTML = personal.map(person => `
        <div
          class="draggable-item card p-4 flex items-center gap-4 cursor-move hover:shadow-lg"
          draggable="true"
          ondragstart="handleDragStart(event, ${person.id})"
          ondragend="handleDragEnd(event)"
          data-person-id="${person.id}">
          <img class="w-12 h-12 rounded-full" src="${person.avatar}" alt="${person.name}"/>
          <div class="flex-1">
            <h3 class="font-semibold text-gray-900">${person.name}</h3>
            <p class="text-sm text-gray-600">${person.role}</p>
          </div>
          ${person.assignmentCount > 0 ? `
            <span class="px-3 py-1 bg-brand-primary text-white rounded-full text-xs font-bold">
              ${person.assignmentCount} asignación${person.assignmentCount > 1 ? 'es' : ''}
            </span>
          ` : ''}
          <span class="material-symbols-outlined text-gray-400">drag_indicator</span>
        </div>
      `).join('');

      const available = personal.filter(p => p.assignmentCount === 0).length;
      document.getElementById('count-disponible').textContent = `${available} disponibles`;
    }

    function renderAreas() {
      const container = document.getElementById('areas-container');

      // Filtrar áreas según vista
      let areasToShow = areasData;
      if (currentView === 'pendientes') {
        // Solo mostrar áreas con al menos un puesto sin asignar
        areasToShow = areasData.filter(area =>
          area.puestos.some(p => p.assigned === null)
        );
      }

      container.innerHTML = areasToShow.map(area => {
        const config = colorConfig[area.color];
        const puestosVacios = area.puestos.filter(p => p.assigned === null).length;

        return `
          <div class="border-2 rounded-xl p-4" style="border-color: ${config.border}; background: ${config.bg};">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full ${config.dot}"></div>
                <h3 class="font-bold text-gray-900">${area.name}</h3>
              </div>
              <div class="flex items-center gap-2">
                ${puestosVacios > 0 ? `
                  <span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs font-bold">
                    ${puestosVacios} vacío${puestosVacios > 1 ? 's' : ''}
                  </span>
                ` : ''}
                <span class="text-xs font-semibold ${config.text}">${area.puestos.length} puesto${area.puestos.length > 1 ? 's' : ''}</span>
              </div>
            </div>

            ${area.puestos.map(puesto => `
              <div class="mb-3 last:mb-0">
                <p class="text-sm font-semibold text-gray-700 mb-2">${puesto.name}</p>
                <div
                  class="drop-zone bg-white"
                  ondragover="handleDragOver(event)"
                  ondragleave="handleDragLeave(event)"
                  ondrop="handleDrop(event, '${area.id}', '${puesto.id}')">
                  ${puesto.assigned !== null ? renderAssignedPerson(puesto.assigned, area.color, area.id, puesto.id) : `
                    <p class="text-center text-gray-400 text-sm py-4">Arrastra personal aquí</p>
                  `}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');

      const pendientesCount = areasData.reduce((total, area) =>
        total + area.puestos.filter(p => p.assigned === null).length, 0
      );
      document.getElementById('count-areas').textContent = `${areasData.length} área${areasData.length > 1 ? 's' : ''}`;
    }

    function renderAssignedPerson(personId, areaColor, areaId, puestoId) {
      const person = personalData.find(p => p.id === personId);
      if (!person) return '';

      const config = colorConfig[areaColor];

      return `
        <div class="card p-3 flex items-center gap-3" style="background: ${config.bg};">
          <img class="w-10 h-10 rounded-full" src="${person.avatar}" alt="${person.name}"/>
          <div class="flex-1">
            <h4 class="font-semibold text-sm">${person.name}</h4>
            <p class="text-xs text-gray-600">${person.role}</p>
          </div>
          <button onclick="removeFromPuesto('${areaId}', '${puestoId}')" class="text-red-500 hover:text-red-700">
            <span class="material-symbols-outlined text-sm">close</span>
          </button>
        </div>
      `;
    }

    function handleDragStart(event, personId) {
      draggedElement = personId;
      event.target.classList.add('dragging');
    }

    function handleDragEnd(event) {
      event.target.classList.remove('dragging');
      draggedElement = null;
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(event, areaId, puestoId) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');

      if (!draggedElement) return;

      const area = areasData.find(a => a.id === areaId);
      if (!area) return;

      const puesto = area.puestos.find(p => p.id === puestoId);
      if (!puesto) return;

      // Verificar si el puesto ya está ocupado
      if (puesto.assigned !== null) {
        alert(`⚠️ Este puesto ya está ocupado`);
        return;
      }

      // Asignar persona al puesto
      puesto.assigned = draggedElement;

      const person = personalData.find(p => p.id === draggedElement);
      showNotification(`✅ ${person.name} asignado/a a ${area.name} - ${puesto.name}`);

      // Actualizar vistas
      renderPersonal();
      renderAreas();
      updateStats();
    }

    function removeFromPuesto(areaId, puestoId) {
      const area = areasData.find(a => a.id === areaId);
      if (!area) return;

      const puesto = area.puestos.find(p => p.id === puestoId);
      if (!puesto) return;

      const person = personalData.find(p => p.id === puesto.assigned);
      puesto.assigned = null;

      showNotification(`🔄 ${person.name} removido/a de ${area.name} - ${puesto.name}`);

      renderPersonal();
      renderAreas();
      updateStats();
    }

    function toggleView() {
      currentView = currentView === 'pendientes' ? 'todas' : 'pendientes';
      document.getElementById('view-label').textContent = currentView === 'pendientes' ? 'Solo Pendientes' : 'Todas las Áreas';
      renderAreas();
    }

    function searchPersonal() {
      const search = document.getElementById('searchPersonal').value.toLowerCase();
      const items = document.querySelectorAll('#personal-container .draggable-item');

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(search) ? 'flex' : 'none';
      });
    }

    function updateStats() {
      const personal = getAvailablePersonal();
      const available = personal.filter(p => p.assignmentCount === 0).length;
      const assigned = personal.filter(p => p.assignmentCount > 0).length;
      const pendientes = areasData.reduce((total, area) =>
        total + area.puestos.filter(p => p.assigned === null).length, 0
      );

      document.getElementById('stat-disponible').textContent = available;
      document.getElementById('stat-asignado').textContent = assigned;
      document.getElementById('stat-pendientes').textContent = pendientes;
      document.getElementById('stat-areas').textContent = areasData.length;
    }

    function showNotification(message) {
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.textContent = message;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    function openCreateModal() {
      document.getElementById('createModal').classList.remove('hidden');
      populateAreaSelect();
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
      document.getElementById('areaName').value = '';
      document.getElementById('puestoName').value = '';
    }

    function toggleCreateFields() {
      const type = document.getElementById('createType').value;

      if (type === 'area') {
        document.getElementById('field-area-name').classList.remove('hidden');
        document.getElementById('field-area-color').classList.remove('hidden');
        document.getElementById('field-select-area').classList.add('hidden');
        document.getElementById('field-puesto-name').classList.add('hidden');
      } else {
        document.getElementById('field-area-name').classList.add('hidden');
        document.getElementById('field-area-color').classList.add('hidden');
        document.getElementById('field-select-area').classList.remove('hidden');
        document.getElementById('field-puesto-name').classList.remove('hidden');
      }
    }

    function populateAreaSelect() {
      const select = document.getElementById('selectArea');
      select.innerHTML = areasData.map(area =>
        `<option value="${area.id}">${area.name}</option>`
      ).join('');
    }

    function createAreaOrPuesto() {
      const type = document.getElementById('createType').value;

      if (type === 'area') {
        const name = document.getElementById('areaName').value.trim();
        const color = document.getElementById('areaColor').value;

        if (!name) {
          alert('Por favor ingresa un nombre para el área');
          return;
        }

        const newId = 'area-' + (areasData.length + 1);
        areasData.push({
          id: newId,
          name: name,
          color: color,
          puestos: []
        });

        showNotification(`✅ Área "${name}" creada`);
      } else {
        const areaId = document.getElementById('selectArea').value;
        const puestoName = document.getElementById('puestoName').value.trim();

        if (!puestoName) {
          alert('Por favor ingresa un nombre para el puesto');
          return;
        }

        const area = areasData.find(a => a.id === areaId);
        if (!area) return;

        const newPuestoId = 'puesto-' + Date.now();
        area.puestos.push({
          id: newPuestoId,
          name: puestoName,
          assigned: null
        });

        showNotification(`✅ Puesto "${puestoName}" creado en ${area.name}`);
      }

      renderAreas();
      updateStats();
      closeCreateModal();
    }

    // Inicializar
    init();
  </script>

  <div class="h-16 lg:hidden"></div>
</body>
</html>
